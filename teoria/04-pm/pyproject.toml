[project]
name = "04-pm"
version = "0.1.0"
description = ""
authors = [
    {name = "Michele Lombardi",email = "michele.lombardi2@unibo.it"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "notebook (>=7.6.3,<8.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pydot (>=4.0.1,<5.0.0)",
    "tensorflow (>=2.21.0,<3.0.0)",
    "tensorflow-probability (>=0.25.0,<0.26.0)",
    "tf-keras (>=2.21.0,<3.0.0)",
    "scipy (>=1.18.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "nbconvert[webpdf] (>=7.17.1,<8.0.0)",
    "jupyterlab-rise (>=0.43.1,<0.44.0)"
]
