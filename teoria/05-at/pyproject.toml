[project]
name = "05-at"
version = "0.1.0"
description = ""
authors = [
    {name = "Michele Lombardi",email = "michele.lombardi2@unibo.it"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "notebook (>=7.6.3,<8.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pydot (>=4.0.1,<5.0.0)",
    "graphviz (>=0.21,<0.22)",
    "xgboost (>=3.4.1,<4.0.0)",
    "shap (>=0.54.1,<0.55.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "boruta (>=0.4.3,<0.5.0)",
    "iprogress (>=0.4,<0.5)",
    "ipywidgets (>=8.1.9,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyterlab-rise (>=0.43.1,<0.44.0)",
    "nbconvert[webpdf] (>=7.17.2,<8.0.0)"
]
